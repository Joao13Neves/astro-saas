<svg
  xmlns="http://www.w3.org/2000/svg"
  fill="none"
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  aria-hidden="true"
  focusable="false"
>
  <ng-container [ngSwitch]="name">
    <ng-container *ngSwitchCase="'email'">
      <rect
        x="3.25"
        y="5.25"
        width="17.5"
        height="13.5"
        rx="2.25"
        stroke="currentColor"
        stroke-width="1.6"
      />
      <path
        d="M4 7.5L12 13.25L20 7.5"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </ng-container>

    <ng-container *ngSwitchCase="'lock'">
      <rect
        x="5.25"
        y="10.5"
        width="13.5"
        height="9.25"
        rx="2"
        stroke="currentColor"
        stroke-width="1.6"
      />
      <path
        d="M8.25 10.5V8.25C8.25 6.17893 9.92893 4.5 12 4.5C14.0711 4.5 15.75 6.17893 15.75 8.25V10.5"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
      />
    </ng-container>

    <ng-container *ngSwitchCase="'eye'">
      <path
        d="M2.7 12.2C3.86 8.95 7.18 6.75 12 6.75C16.82 6.75 20.14 8.95 21.3 12.2C20.14 15.45 16.82 17.65 12 17.65C7.18 17.65 3.86 15.45 2.7 12.2Z"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
      <circle
        cx="12"
        cy="12.2"
        r="2.6"
        stroke="currentColor"
        stroke-width="1.6"
      />
    </ng-container>

    <ng-container *ngSwitchCase="'eye-off'">
      <path
        d="M3 3L21 21"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
      />
      <path
        d="M9.88 6.12C10.55 5.92 11.26 5.8 12 5.8C16.82 5.8 20.14 8 21.3 11.25C20.9 12.35 20.28 13.33 19.5 14.15"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M6.2 8.35C4.7 9.4 3.55 10.85 2.7 12.55C3.86 15.8 7.18 18 12 18C13.18 18 14.3 17.83 15.33 17.52"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </ng-container>
  </ng-container>
</svg>
